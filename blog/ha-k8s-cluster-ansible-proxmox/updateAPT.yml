- name: Aggiorna i nodi con APT
  hosts: k8s
  become: true
  serial: 1            # un nodo alla volta, così non li riavvii tutti insieme
  tasks:
    - name: Aggiorna la cache apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade di tutti i pacchetti
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true

    - name: Controlla se serve il reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Riavvia se necessario
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: reboot_required.stat.exists